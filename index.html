<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretty Little Baby - Interactive Baby Game</title> 
    <link rel="stylesheet" href="style.css">
  
</head>
<body>

    <div class="title pink" id="title">Pretty Little Baby</div>



     <div class="gender-toggle-vertical" id="genderToggle">
    <div>
        <button class="gender-btn-vertical girl active" onclick="setGender('girl')">👧</button>
        <div class="gender-label">Girl</div>
    </div>
    <div>
        <button class="gender-btn-vertical boy" onclick="setGender('boy')">👦</button>
        <div class="gender-label">Boy</div>
    </div>
</div>
    
    
    <div class="main-wrapper">
        <div class="baby-container" id="babyContainer">

            <div class="bow" id="girlBow">
                <div class="bow-loop left"></div>
                <div class="bow-loop right"></div>
                <div class="bow-center"></div>
            </div>
        
        
            <div class="cap" id="boyCap">
                <div class="cap-brim"></div>
                <div class="cap-button"></div>
            </div>    

            <div class="ear left"></div>
            <div class="ear right"></div>

            <div class="head" id="babyHead">
                <div class="face-center">
                    <div class="eye left"><div class="pupil"></div></div>
                    <div class="eye right"><div class="pupil"></div></div>
                    <div class="nose"></div>
                    <div class="cheek left" id="cheekLeft"></div>
                    <div class="cheek right" id="cheekRight"></div>
                    <div class="mouth"></div>
                </div>
            </div>
            <div class="arm left"><div class="hand"></div></div>
            <div class="arm right"><div class="hand"></div></div>
            <div class="body" id="babyBody"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
        </div>
    </div>

    <div class="drag-items-vertical" id="dragItemsContainer">
        <div class="feeder drag-item" data-type="feeder" draggable="true">
            <div class="label">Baby Bottle</div>
        </div>
        <div class="pacifier-drag drag-item" data-type="pacifier" draggable="true">
            <div class="label">Pacifier</div>
        </div>
        <div class="rattle-drag drag-item" data-type="rattle" draggable="true">
            <div class="label">Baby Rattle</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
